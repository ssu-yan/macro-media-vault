# 認識論狀態 → 邊信心上限
#
# 這是圖譜層與沙盤層的接縫。
#
# 為什麼需要它：沙盤裡的節點會被檢驗，狀態會變（未檢驗 → 證據混雜 → 已證偽）。
# 如果圖譜這邊的邊不跟著動，兩層就會脫節——沙盤說「S5 已證偽」，
# 圖譜還在用 0.6 的信心往它傳導。這個檔案讓狀態變更**自動**傳到圖譜。
#
# 核心規則：**對一條邊的信心，不可能高於你對它兩端的信心。**
#   生效信心 = min(宣告信心, 證據等級上限, 起點節點上限, 終點節點上限)
#
# 上限是安全網，不是替代品。若某個機制被實證打臉，
# 除了上限之外還應該**實質下修宣告信心**——見 ST-INFO-WAR → S3 的處理。

evidence_caps:
  已實現: 1.00      # 這條邊在真實世界發生過，可指出時間與數字
  有先例: 0.75      # 歷史上類似情境發生過，但本次未必重演
  理論推導: 0.50    # 只有機制論證，沒有實證

status_caps:
  事實: 1.00        # 有直接測量支持
  進行中: 0.80      # 方向明確、終點未定
  有支持: 0.75      # 通過事先寫死的檢驗
  證據混雜: 0.50    # 檢驗過，部分成立
  未檢驗: 0.45      # 從未檢驗的手寫斷言
  難以檢驗: 0.35    # 短期內無可證偽的預測
  自評最弱: 0.30    # 作者自己標記為薄弱
  已證偽: 0.00      # 檢驗過且失敗 → 指向它的邊整條移除

# 沙盤節點的狀態（與 [[沙盤總覽]] 的認識論狀態表對應）
#
# ⚠️ 已知風險：這份清單與沙盤總覽的表格是**兩份手動維護的副本**，會漂移。
#    改任何一邊都要同步另一邊。長期解法是讓總覽的表格由這個檔案產生。
nodes:
  S0-分發權解體: 事實
  S1-廣告餅重分配: 事實
  S2-信任崩落: 事實
  S3-信念離散度上升: 證據混雜      # V6 2026-08-14
  S4-敘事加速: 未檢驗
  S5-情緒與支出脫鉤: 已證偽        # V1/V1b/V1c 2026-08-13
  S6-央行溝通失效: 未檢驗
  S7-政策不確定性溢價: 未檢驗
  S8-企業資本支出遞延: 自評最弱
  S9-市場二階量改變: 證據混雜      # V6 部分檢驗
  L0-世代替換: 事實
  L1-AI成為主要新聞介面: 進行中
  L2-監管介入: 難以檢驗
  L3-公共事實基礎侵蝕: 難以檢驗
  L4-集中化vs碎片化: 難以檢驗
  L5-長期市場均衡: 難以檢驗
